<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5faf4">
  <meta name="description" content="Pickle Point Match dashboard for open-play sessions, players, courts and match management.">
  <title>Pickle Point Match - Dashboard</title>
  <link rel="icon" type="image/png" href="/pickleball-p-emblem.png">
  <link rel="stylesheet" href="/dashboard.css?v=dashboard-stability-20261119-v24">
  <script src="/dashboard.js?v=dashboard-ranking-unified-20261119-v1" defer></script>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="/manage" data-page="dashboard" aria-label="PICKLE POINT MATCH dashboard">
        <span class="brand-ball" aria-hidden="true"><img src="/pickleball-p-emblem.png" alt=""></span>
        <span class="brand-name">PICKLE POINT MATCH</span>
      </a>
      <div class="sidebar-caption">WORKSPACE</div>
      <nav class="nav-list" id="navList">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon" data-icon="dashboard"></span><span>Dashboard</span></button>
        <button class="nav-item" data-page="sessions"><span class="nav-icon" data-icon="calendar"></span><span>Open Play Sessions</span></button>
        <button class="nav-item" data-page="players"><span class="nav-icon" data-icon="users"></span><span>Players</span></button>
        <button class="nav-item" data-page="matches"><span class="nav-icon" data-icon="trophy"></span><span>Match Records</span></button>
        <button class="nav-item" data-page="rankings"><span class="nav-icon" data-icon="chart"></span><span>Player Rankings</span></button>
        <button class="nav-item" data-page="courts"><span class="nav-icon" data-icon="pin"></span><span>Courts &amp; Locations</span></button>
        <button class="nav-item" data-page="schedule"><span class="nav-icon" data-icon="calendar"></span><span>Schedule</span></button>
        <button class="nav-item" data-page="reports"><span class="nav-icon" data-icon="report"></span><span>Reports</span></button>
        <button class="nav-item" data-page="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></button>
      </nav>
      <div class="sidebar-shortcuts" aria-label="Queueing system shortcuts">
        <a href="/queueing" target="_blank" rel="noopener"><span data-icon="court"></span> Live Queue</a>
        <a href="/session" target="_blank" rel="noopener"><span data-icon="calendar"></span> Session Setup</a>
      </div>
      <div class="sidebar-version">PICKLE POINT MATCH <span>OPEN PLAY MANAGER</span></div>
    </aside>

    <section class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation"><span data-icon="menu"></span></button>
          <div class="breadcrumb" id="breadcrumb">Dashboard</div>
        </div>
        <div class="topbar-right">
          <label class="global-search">
            <span data-icon="search" aria-hidden="true"></span>
            <input id="globalSearch" type="search" placeholder="Search players, sessions..." autocomplete="off" aria-label="Search current page">
          </label>
          <button class="icon-button" id="notificationsBtn" type="button" aria-label="Notifications" title="Notifications"><span data-icon="bell"></span><i class="notification-dot"></i></button>
          <button class="profile-button" id="profileBtn" type="button" aria-label="Organizer menu"><span class="profile-avatar" id="organizerAvatar" aria-hidden="true"><span id="organizerAvatarFallback">HD</span><img id="organizerAvatarImage" alt="" hidden></span><span class="profile-copy"><strong id="organizerName">Organizer</strong><small id="organizerUsername" title="">username</small></span><span class="profile-chevron" data-icon="chevron-down"></span></button>
        </div>
      </header>
      <main class="page-content" id="pageContent" tabindex="-1" aria-live="polite">
        <div class="loading-state"><span class="loading-spinner"></span> Loading HUSAY DINKERS...</div>
      </main>
    </section>
  </div>

  <div class="mobile-scrim" id="mobileScrim"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="top-popover" id="topPopover" hidden></div>
</body>
</html>
