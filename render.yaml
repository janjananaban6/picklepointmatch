services:
  - type: web
    name: picklepointmatch
    runtime: node
    # Free tier is retained to avoid enabling paid billing without owner approval.
    # Upgrade before production use; see DEPLOYMENT-SECURITY-CHECKLIST.md.
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pickle-point-match-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ORGANIZER_USERNAME
        value: organizer
      - key: ORGANIZER_PASSWORD
        generateValue: true
      - key: PANEL_USERNAME
        value: admin
      - key: PANEL_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: pickle-point-match-db
    # Free PostgreSQL is temporary and has no managed backups; upgrade for production.
    databaseName: pickle_point_match
    user: pickle_point_match
    plan: free
    ipAllowList: []
