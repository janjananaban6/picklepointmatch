services:
  - type: web
    name: picklepointmatch
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: picklepointmatchdb
          property: connectionString
      - key: ORGANIZER_USERNAME
        value: organizer
      - key: ORGANIZER_PASSWORD
        generateValue: true
      - key: PANEL_USERNAME
        value: admin
      - key: PANEL_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: pickle-point-match-db
    databaseName: pickle_point_match
    user: pickle_point_match
    plan: free
    ipAllowList: []
