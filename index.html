<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1d2b">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Organizer sign-in for Pickle Point Match.">
  <title>Organizer Login — Pickle Point Match</title>
  <link rel="icon" type="image/png" href="pickleball-p-emblem.png">
  <link rel="stylesheet" href="login.css?v=organizer-login-20261023-1">
  <script src="login.js?v=organizer-login-20261023-1" defer></script>
</head>
<body class="organizer-login-page">
  <main class="login-shell">
    <section class="login-brand-panel" aria-label="Pickle Point Match">
      <div class="court-orbit orbit-one"></div>
      <div class="court-orbit orbit-two"></div>
      <div class="brand-content">
        <img class="brand-mark" src="pickleball-p-emblem.png" alt="Pickle Point Match logo">
        <div class="brand-wordmark"><span>PICKLE <strong>POINT</strong></span><small>M A T C H</small></div>
        <p class="brand-tagline">Your courts. Your players. One live session.</p>
        <div class="brand-court-lines" aria-hidden="true"><span></span><span></span><i></i></div>
      </div>
      <p class="brand-footer">ORGANIZER ACCESS</p>
    </section>

    <section class="login-form-panel">
      <div class="mobile-brand">
        <img src="pickleball-p-emblem.png" alt="">
        <span>PICKLE <b>POINT</b> MATCH</span>
      </div>
      <div class="login-heading">
        <div class="secure-badge"><span class="secure-dot"></span> SECURE SIGN IN</div>
        <h1>Welcome back</h1>
        <p>Sign in with your organizer account to manage your live queue.</p>
      </div>

      <form id="organizerLoginForm" class="login-form" autocomplete="on">
        <label for="organizerUsername">Organizer username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
          <input id="organizerUsername" name="username" type="text" value="organizer" placeholder="Enter username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="80">
        </div>

        <label for="organizerPassword">Password</label>
        <div class="input-wrap password-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3M12 14v3"/></svg>
          <input id="organizerPassword" name="password" type="password" placeholder="Enter organizer password" autocomplete="current-password" required maxlength="200">
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">Show</button>
        </div>

        <p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>
        <button id="loginSubmit" class="login-submit" type="submit"><span>Sign in</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="login-footnote"><span aria-hidden="true">●</span> Organizer access only</p>
      </form>
    </section>
  </main>
  <footer class="page-footer">PICKLE POINT MATCH <span>•</span> LIVE QUEUE MANAGEMENT</footer>
</body>
</html>
